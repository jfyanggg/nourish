<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nourish · Daily Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --surface-alt: #f5f5f0;
    --border: #e7e5e0;
    --border-hover: #d4d2cc;
    --text: #1c1917;
    --text-muted: #78716c;
    --text-faint: #a8a29e;
    --bar-track: #ebe9e3;
    --accent: #1c1917;
    --accent-text: #fafaf7;
    --modal-overlay: rgba(28,25,23,0.4);
    --good: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --neutral: #57534e;
  }
  html[data-theme="dark"] {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-alt: #222;
    --border: #2a2a2a;
    --border-hover: #3a3a3a;
    --text: #f5f5f4;
    --text-muted: #a8a29e;
    --text-faint: #57534e;
    --bar-track: #262626;
    --accent: #fafaf9;
    --accent-text: #0f0f0f;
    --modal-overlay: rgba(0,0,0,0.6);
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --neutral: #a8a29e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: #fafaf7;
    background: var(--bg);
    color: #1c1917;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1024px; margin: 0 auto; padding: 24px 16px; }
  @media (min-width: 640px) { .container { padding: 40px 24px; } }

  #error-banner {
    display: none;
    background: #fee;
    border: 1px solid #f99;
    color: #900;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 12px;
    font-family: monospace;
    word-wrap: break-word;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 1px solid #e7e5e0;
    border-bottom-color: var(--border);
  }
  @media (min-width: 640px) { header { padding-bottom: 24px; margin-bottom: 32px; } }
  .eyebrow {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #78716c;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  @media (min-width: 640px) { .eyebrow { font-size: 10px; } }
  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 40px;
    line-height: 1;
    color: #1c1917;
    color: var(--text);
  }
  .title .dot { font-style: italic; color: #a8a29e; color: var(--text-faint); }
  @media (min-width: 640px) { .title { font-size: 56px; } }
  .header-actions { display: flex; gap: 4px; align-items: center; }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px;
    border-radius: 999px;
    color: inherit;
    opacity: 0.7;
  }
  .icon-btn:hover { opacity: 1; }

  /* Date selector / calendar */
  .date-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 0;
    margin-bottom: 24px;
    border-bottom: 1px solid #e7e5e0;
    border-bottom-color: var(--border);
  }
  @media (min-width: 640px) { .date-bar { margin-bottom: 32px; } }
  .date-nav {
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    padding: 8px 12px;
    opacity: 0.6;
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
  }
  .date-nav:hover { opacity: 1; }
  .date-nav:disabled { opacity: 0.2; cursor: not-allowed; }
  .date-display {
    flex: 1;
    text-align: center;
    cursor: pointer;
  }
  .date-current {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: #1c1917;
    color: var(--text);
  }
  @media (min-width: 640px) { .date-current { font-size: 18px; } }
  .date-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #78716c;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .today-badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: #1c1917;
    background: var(--accent);
    color: #fafaf7;
    color: var(--accent-text);
    padding: 2px 6px;
    border-radius: 2px;
    vertical-align: 1px;
  }

  /* Calendar dropdown */
  .calendar {
    position: absolute;
    z-index: 40;
    background: #fff;
    background: var(--surface);
    border: 1px solid #e7e5e0;
    border-color: var(--border);
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    width: 280px;
    max-width: calc(100vw - 32px);
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cal-month {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-dow {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a8a29e;
    color: var(--text-faint);
    text-align: center;
    padding: 4px 0;
  }
  .cal-day {
    background: none;
    border: 1px solid transparent;
    cursor: pointer;
    padding: 8px 0;
    font-family: inherit;
    font-size: 13px;
    color: inherit;
    text-align: center;
    border-radius: 4px;
  }
  .cal-day:hover:not(:disabled) { background: #f5f5f0; background: var(--surface-alt); }
  .cal-day.empty { cursor: default; }
  .cal-day.has-data { font-weight: 500; }
  .cal-day.has-data::after {
    content: '';
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 999px;
    background: #1c1917;
    background: var(--accent);
    margin: 2px auto 0;
  }
  .cal-day.has-gym::before {
    content: '💪';
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 7px;
    line-height: 1;
  }
  .cal-day { position: relative; }
  .cal-day.selected {
    background: #1c1917;
    background: var(--accent);
    color: #fafaf7;
    color: var(--accent-text);
  }
  .cal-day.selected::after { background: #fafaf7; background: var(--accent-text); }
  .cal-day.today { border-color: #1c1917; border-color: var(--accent); }
  .cal-day:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #78716c;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  @media (min-width: 640px) { .section-label { font-size: 10px; margin-bottom: 20px; } }

  /* Progress bars */
  .bars-section { margin-bottom: 36px; }
  @media (min-width: 640px) { .bars-section { margin-bottom: 48px; } }
  .bar-row {
    display: block;
    margin-bottom: 18px;
    background: var(--bg);
    transition: transform 200ms ease;
    position: relative;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row-dragging {
    transition: none;
    opacity: 0.85;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  html[data-theme="dark"] .bar-row-dragging { box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  @media (min-width: 640px) { .bar-row { margin-bottom: 22px; } }
  .bar-label-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .bar-handle {
    display: inline-flex;
    align-items: center;
    cursor: grab;
    color: var(--text-faint);
    opacity: 0.5;
    padding: 2px 4px;
    margin-left: -4px;
    touch-action: none;
    -ms-touch-action: none;
  }
  .bar-handle:hover { opacity: 1; }
  .bar-handle:active { cursor: grabbing; }
  .bar-avg {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .bar-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .bar-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 500;
    color: #78716c;
    color: var(--text-muted);
  }
  @media (min-width: 640px) { .bar-label { font-size: 11px; } }
  .bar-values {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: #1c1917;
    color: var(--text);
    white-space: nowrap;
  }
  @media (min-width: 640px) { .bar-values { font-size: 20px; } }
  .bar-values .of {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #a8a29e;
    color: var(--text-faint);
    margin-left: 4px;
  }
  .bar-track {
    position: relative;
    display: block;
    width: 100%;
    height: 8px;
    background-color: #ebe9e3;
    border-radius: 999px;
    overflow: hidden;
  }
  html[data-theme="dark"] .bar-track { background-color: #262626; }
  .bar-fill {
    display: block;
    height: 100%;
    border-radius: 999px;
    background-color: #57534e;
    -webkit-transition: width 700ms ease-out, background-color 400ms;
    transition: width 700ms ease-out, background-color 400ms;
  }
  .bar-fill.good { background-color: #15803d; }
  .bar-fill.warn { background-color: #b45309; }
  .bar-fill.bad { background-color: #b91c1c; }
  .bar-fill.neutral { background-color: #57534e; }
  html[data-theme="dark"] .bar-fill.good { background-color: #4ade80; }
  html[data-theme="dark"] .bar-fill.warn { background-color: #fbbf24; }
  html[data-theme="dark"] .bar-fill.bad { background-color: #f87171; }
  html[data-theme="dark"] .bar-fill.neutral { background-color: #a8a29e; }
  .bar-status { display: block; font-size: 10px; margin-top: 6px; color: #57534e; }
  @media (min-width: 640px) { .bar-status { font-size: 11px; } }
  .bar-status.good { color: #15803d; }
  .bar-status.warn { color: #b45309; }
  .bar-status.bad { color: #b91c1c; }
  .bar-status.faint { color: #a8a29e; color: var(--text-faint); }
  html[data-theme="dark"] .bar-status.good { color: #4ade80; }
  html[data-theme="dark"] .bar-status.warn { color: #fbbf24; }
  html[data-theme="dark"] .bar-status.bad { color: #f87171; }

  /* Form */
  .form-section { margin-bottom: 32px; }
  @media (min-width: 640px) { .form-section { margin-bottom: 40px; } }
  .form-card {
    background: #fff;
    background: var(--surface);
    border: 1px solid #e7e5e0;
    border-color: var(--border);
    padding: 16px;
  }
  @media (min-width: 640px) { .form-card { padding: 24px; } }
  .name-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #e7e5e0;
    border-bottom-color: var(--border);
    padding: 0 0 8px 0;
    margin-bottom: 16px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 20px;
    color: inherit;
    outline: none;
  }
  @media (min-width: 640px) { .name-input { font-size: 24px; padding-bottom: 12px; margin-bottom: 20px; } }
  .name-input::placeholder { color: #a8a29e; opacity: 0.6; }
  .macros-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) { .macros-grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }
  .macros-grid label {
    display: block;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #a8a29e;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .num-input {
    width: 100%;
    background: #f5f5f0;
    background: var(--surface-alt);
    border: 1px solid #e7e5e0;
    border-color: var(--border);
    color: inherit;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
    font-family: inherit;
  }
  .num-input::-webkit-inner-spin-button,
  .num-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .form-qty-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: 28px;
  }
  .form-qty-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 0;
  }
  .form-qty-toggle:hover { color: var(--text-muted); }
  .form-qty-stepper {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .form-qty-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 8px;
  }
  .form-qty-btn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: inherit;
    cursor: pointer;
    width: 28px;
    height: 28px;
    padding: 0;
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .form-qty-btn:hover { background: var(--border); }
  .form-qty-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    min-width: 32px;
    text-align: center;
    color: var(--text);
  }
  .record-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: #1c1917;
    background: var(--accent);
    color: #fafaf7;
    color: var(--accent-text);
    border: none;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 500;
    font-family: inherit;
  }
  @media (min-width: 640px) { .record-btn { margin-top: 20px; padding: 14px; } }
  .record-btn:disabled { opacity: 0.3; }
  .form-disabled {
    opacity: 0.5;
    pointer-events: none;
  }
  .form-disabled-message {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: #78716c;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Gym tracker */
  .gym-section {
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  @media (min-width: 640px) { .gym-section { margin-bottom: 40px; } }
  .gym-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .gym-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--border-hover);
    border-radius: 4px;
    background: var(--surface);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background 200ms, border-color 200ms;
  }
  .gym-checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .gym-checkbox:checked::after {
    content: '';
    position: absolute;
    top: 3px; left: 6px;
    width: 5px; height: 9px;
    border: 2px solid var(--accent-text);
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .gym-label-text {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--text-muted);
  }
  .gym-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-text);
    padding: 3px 8px;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 200ms;
    pointer-events: none;
  }
  .gym-badge.visible { opacity: 1; }

  /* Library */
  .library-section { margin-bottom: 32px; }
  @media (min-width: 640px) { .library-section { margin-bottom: 40px; } }
  .library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  @media (min-width: 640px) { .library-header { margin-bottom: 20px; } }
  .library-header .section-label { margin-bottom: 0; }
  .library-chevron {
    color: var(--text-faint);
    transition: transform 250ms ease;
    flex-shrink: 0;
  }
  .library-chevron.open { transform: rotate(180deg); }
  .library-body {
    overflow: hidden;
    transition: max-height 300ms ease, opacity 250ms ease;
    max-height: 0;
    opacity: 0;
  }
  .library-body.open {
    max-height: 1200px;
    opacity: 1;
  }
  .library-search {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 6px 0 8px 0;
    margin-bottom: 14px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: inherit;
    outline: none;
  }
  .library-search::placeholder { color: var(--text-faint); opacity: 0.7; }
  .library-search:focus { border-bottom-color: var(--text-muted); }
  .library-empty {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--text-faint);
    text-align: center;
    padding: 12px 0;
  }
  .library-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .saved-food {
    display: inline-flex;
    align-items: center;
    background: #fff;
    background: var(--surface);
    border: 1px solid #e7e5e0;
    border-color: var(--border);
    border-radius: 999px;
    padding: 0;
    overflow: hidden;
  }
  .saved-food .pill-add {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 14px;
    color: inherit;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .saved-food .pill-cal {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: #a8a29e;
    color: var(--text-faint);
    margin-left: 4px;
  }
  .saved-food .pill-qty {
    display: inline-flex;
    align-items: center;
    border-right: 1px solid #e7e5e0;
    border-right-color: var(--border);
  }
  .saved-food .qty-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 8px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
  }
  .saved-food .qty-btn:hover { color: var(--text); }
  .saved-food .qty-val {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text);
    min-width: 18px;
    text-align: center;
    line-height: 1;
  }
  .saved-food .pill-edit {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 6px;
    color: #a8a29e;
    color: var(--text-faint);
    border-left: 1px solid #e7e5e0;
    border-left-color: var(--border);
    display: flex;
    align-items: center;
  }
  .saved-food .pill-edit:hover { color: var(--text); }
  .saved-food .pill-remove {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 10px 8px 4px;
    color: #a8a29e;
    color: var(--text-faint);
    border-left: 1px solid #e7e5e0;
    border-left-color: var(--border);
    display: flex;
    align-items: center;
  }

  .entries-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .entries-count { color: #a8a29e; color: var(--text-faint); }
  .empty-state {
    border: 1px dashed #e7e5e0;
    border-color: var(--border);
    padding: 48px 16px;
    text-align: center;
  }
  .empty-state p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: #78716c;
    color: var(--text-muted);
  }
  .empty-state span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #a8a29e;
    color: var(--text-faint);
    margin-top: 8px;
  }
  ul.entries { list-style: none; background: #e7e5e0; background: var(--border); }
  ul.entries li {
    background: #fff;
    background: var(--surface);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    margin-bottom: 1px;
  }
  ul.entries li:last-child { margin-bottom: 0; }
  .entry-info { flex: 1; min-width: 0; }
  .entry-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .entry-macros {
    font-size: 10px;
    margin-top: 2px;
    color: #78716c;
    color: var(--text-muted);
  }
  .entry-macros .v { color: inherit; font-weight: 500; }
  .edit-entry-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #a8a29e;
    color: var(--text-faint);
    padding: 8px;
    margin-left: 4px;
  }
  .edit-entry-btn:hover { color: var(--text); }
  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #a8a29e;
    color: var(--text-faint);
    padding: 8px;
    margin-left: 8px;
  }

  .footnote {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 10px;
    color: #a8a29e;
    color: var(--text-faint);
    margin-top: 40px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(28,25,23,0.4);
    background: var(--modal-overlay);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  @media (min-width: 640px) { .modal-overlay { align-items: center; padding: 16px; } }
  .modal {
    background: #fafaf7;
    background: var(--bg);
    border: 1px solid #e7e5e0;
    border-color: var(--border);
    width: 100%;
    padding: 24px;
    max-height: 90vh;
    overflow-y: auto;
  }
  @media (min-width: 640px) { .modal { max-width: 480px; padding: 32px; } }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; }
  .modal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e7e5e0;
    border-bottom-color: var(--border);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .modal-row:last-of-type { border-bottom: none; margin-bottom: 0; }
  .modal-row label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #78716c;
    color: var(--text-muted);
  }
  .goal-input {
    width: 96px;
    text-align: right;
    background: transparent;
    border: none;
    border-bottom: 1px solid #d4d2cc;
    border-bottom-color: var(--border-hover);
    color: inherit;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    padding: 2px 4px;
    outline: none;
  }
  .modal .unit { font-size: 13px; color: #a8a29e; color: var(--text-faint); margin-left: 4px; width: 24px; }
  .cal-check {
    margin-top: 18px;
    padding: 10px 12px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .cal-check strong { color: var(--text); font-weight: 500; }
  .cal-check-warn { border-color: var(--warn); color: var(--warn); }
  .cal-check-warn strong { color: var(--warn); }
  .cal-check-bad { border-color: var(--bad); color: var(--bad); }
  .cal-check-bad strong { color: var(--bad); }
  .modal-save {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: #1c1917;
    background: var(--accent);
    color: #fafaf7;
    color: var(--accent-text);
    border: none;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="container">
  <div id="error-banner"></div>

  <header>
    <div>
      <div class="eyebrow">Daily Ledger</div>
      <h1 class="title">Nourish<span class="dot">.</span></h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme">
        <svg id="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="date-bar">
    <button class="date-nav" id="date-prev" type="button" aria-label="Previous day">‹</button>
    <div class="date-display" id="date-display">
      <div class="date-current" id="date-current">Today</div>
      <div class="date-label" id="date-label">tap to choose date</div>
    </div>
    <button class="date-nav" id="date-next" type="button" aria-label="Next day">›</button>
  </div>

  <div id="calendar-container"></div>

  <section class="bars-section">
    <div class="section-label">Targets</div>
    <div id="bars-list">
      <!-- Rendered by JS -->
    </div>
  </section>

  <section class="form-section" id="form-section">
    <div class="section-label">Add an Entry</div>
    <div class="form-card" id="form-card">
      <input id="name" class="name-input" placeholder="What did you eat?" />
      <div class="macros-grid">
        <div><label>Cal</label><input id="m-calories" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label>Fat (g)</label><input id="m-fat" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label>Cholesterol (mg)</label><input id="m-cholesterol" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label>Sodium (mg)</label><input id="m-sodium" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label>Carbs (g)</label><input id="m-carbs" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label>Fiber (g)</label><input id="m-fiber" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label>Sugar (g)</label><input id="m-sugar" class="num-input" type="number" inputmode="decimal" placeholder="0" /></div>

  <section class="library-section" id="library-section" style="display:none;">
    <div class="library-header" id="library-header">
      <div class="section-label" style="margin:0;">Saved Foods <span class="entries-count" id="library-count"></span></div>
      <svg class="library-chevron" id="library-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="library-body" id="library-body">
      <input type="text" id="library-search" class="library-search" placeholder="Filter saved foods…" />
      <div class="library-grid" id="library-grid"></div>
      <div class="library-empty" id="library-empty" style="display:none;">No matches.</div>
    </div>

  <div class="gym-section" id="gym-section">

      <input type="checkbox" class="gym-checkbox" id="gym-checkbox" />
      <span class="gym-label-text">Gym day</span>
    </label>
    <span class="gym-badge" id="gym-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Logged
    </span>

  <section>
    <div class="entries-header">
      <div class="section-label" style="margin: 0;"><span id="entries-heading">Today's Entries</span> <span class="entries-count" id="entries-count"></span></div>
    </div>
    <div id="entries-area"></div>
  </section>

  <p class="footnote">Resets at the dawn of each new day.</p>

<div id="modal-root"></div>

<script>
window.onerror = function(msg, src, line) {
  try {
    var b = document.getElementById('error-banner');
    if (b) { b.style.display = 'block'; b.textContent = 'Error line ' + line + ': ' + msg; }
  } catch (e) {}
  return false;
};

function nourishInit() {
try {
  var STORAGE_PREFIX = 'nourish:';

  function pad(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function dateToKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayDate() { var d = new Date(); d.setHours(0,0,0,0); return d; }
  function keyToDate(key) {
    var parts = key.split('-');
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, parseInt(parts[2],10));
  }
  function foodsKey(dateKey) { return STORAGE_PREFIX + 'foods:' + dateKey; }

  function lsGet(k) { try { return window.localStorage ? window.localStorage.getItem(k) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { if (window.localStorage) window.localStorage.setItem(k, v); } catch (e) {} }
  function lsRemove(k) { try { if (window.localStorage) window.localStorage.removeItem(k); } catch (e) {} }
  function lsKeys() {
    var keys = [];
    try {
      if (!window.localStorage) return keys;
      for (var i = 0; i < window.localStorage.length; i++) {
        var k = window.localStorage.key(i);
        if (k) keys.push(k);
      }
    } catch (e) {}
    return keys;
  }

  var defaultGoals = {
    calories: 1800, protein: 180, carbs: 200, fat: 60,
    fiber: 40, sugar: 40, cholesterol: 300, sodium: 2000
  };

  var macroMeta = [
    { key: 'calories', label: 'Calories', unit: '', type: 'limit' },
    { key: 'fat', label: 'Fat', unit: 'g', type: 'limit' },
    { key: 'cholesterol', label: 'Cholesterol', unit: 'mg', type: 'limit' },
    { key: 'sodium', label: 'Sodium', unit: 'mg', type: 'limit' },
    { key: 'carbs', label: 'Carbs', unit: 'g', type: 'limit' },
    { key: 'fiber', label: 'Fiber', unit: 'g', type: 'target' },
    { key: 'sugar', label: 'Sugar', unit: 'g', type: 'limit' },
    { key: 'protein', label: 'Protein', unit: 'g', type: 'target' }
  ];

  // State
  var selectedDate = todayDate();
  var foods = []; // foods for currently selected date

  var goals = {};
  for (var dk in defaultGoals) if (defaultGoals.hasOwnProperty(dk)) goals[dk] = defaultGoals[dk];
  try {
    var rawGoals = lsGet(STORAGE_PREFIX + 'goals');
    if (rawGoals) {
      var parsed = JSON.parse(rawGoals);
      if (parsed && typeof parsed === 'object') {
        for (var gk in parsed) if (parsed.hasOwnProperty(gk)) goals[gk] = parsed[gk];
      }
    }
  } catch (e) {}

  var dark = lsGet(STORAGE_PREFIX + 'theme') === 'dark';

  var library = [];
  try {
    var rawLib = lsGet(STORAGE_PREFIX + 'library');
    if (rawLib) library = JSON.parse(rawLib) || [];
  } catch (e) { library = []; }

  // Bar display order — array of macro keys
  var barOrder = macroMeta.map(function(m) { return m.key; });
  try {
    var rawOrder = lsGet(STORAGE_PREFIX + 'barOrder');
    if (rawOrder) {
      var savedOrder = JSON.parse(rawOrder);
      if (Array.isArray(savedOrder)) {
        // Validate: must contain exactly the same macro keys
        var validKeys = {};
        for (var vk = 0; vk < macroMeta.length; vk++) validKeys[macroMeta[vk].key] = true;
        var filtered = [];
        var seen = {};
        for (var so = 0; so < savedOrder.length; so++) {
          var k = savedOrder[so];
          if (validKeys[k] && !seen[k]) { filtered.push(k); seen[k] = true; }
        }
        // Append any missing keys (e.g. if macroMeta gains new ones in the future)
        for (var mk = 0; mk < macroMeta.length; mk++) {
          if (!seen[macroMeta[mk].key]) filtered.push(macroMeta[mk].key);
        }
        if (filtered.length === macroMeta.length) barOrder = filtered;
      }
    }
  } catch (e) {}
  function saveBarOrder() { lsSet(STORAGE_PREFIX + 'barOrder', JSON.stringify(barOrder)); }
  function getMacroByKey(k) {
    for (var i = 0; i < macroMeta.length; i++) if (macroMeta[i].key === k) return macroMeta[i];
    return null;
  }

  function loadFoodsForDate(d) {
    var raw = lsGet(foodsKey(dateToKey(d)));
    try { return raw ? (JSON.parse(raw) || []) : []; } catch (e) { return []; }
  }

  function saveFoodsForDate(d, list) { lsSet(foodsKey(dateToKey(d)), JSON.stringify(list)); }

  function totals() {
    var t = {};
    for (var i = 0; i < macroMeta.length; i++) t[macroMeta[i].key] = 0;
    for (var j = 0; j < foods.length; j++) {
      var f = foods[j];
      for (var m = 0; m < macroMeta.length; m++) {
        var key = macroMeta[m].key;
        t[key] += (Number(f[key]) || 0);
      }
    }
    return t;
  }

  function getStatusClass(meta, current, goal, isCurrentDay) {
    if (!goal || goal <= 0) return { fill: 'neutral', status: 'faint', text: '—' };
    var pct = current / goal;
    var diff = current - goal;
    var round = function(n) { return Math.round(n); };
    if (meta.type === 'limit') {
      if (pct >= 1) return { fill: 'bad', status: 'bad', text: '+' + round(diff) + meta.unit + ' over' };
      if (pct >= 0.85) return { fill: 'warn', status: 'warn', text: round(Math.abs(diff)) + meta.unit + ' left' };
      return { fill: 'good', status: 'good', text: round(Math.abs(diff)) + meta.unit + ' left' };
    } else {
      // target type (protein, fiber)
      if (pct >= 1) return { fill: 'good', status: 'good', text: pct > 1 ? 'goal met · +' + round(diff) + meta.unit : 'goal met' };

      // Protein-specific pace check (only today, only after late morning)
      if (meta.key === 'protein' && isCurrentDay) {
        var now = new Date();
        var hours = now.getHours() + now.getMinutes() / 60;
        // Don't flag until 11 AM to allow late-breakfast / brunch patterns
        if (hours >= 11) {
          // Expected progress: linear from 8 AM (0%) to 9 PM (100%)
          var expected = (hours - 8) / (21 - 8);
          if (expected > 1) expected = 1;
          var deficit = expected - pct;
          if (deficit >= 0.35) {
            return { fill: 'bad', status: 'bad', text: round(Math.abs(diff)) + meta.unit + ' to go · behind pace' };
          } else if (deficit >= 0.2) {
            return { fill: 'warn', status: 'warn', text: round(Math.abs(diff)) + meta.unit + ' to go · trailing' };
          }
        }
      }
      return { fill: 'neutral', status: 'faint', text: round(Math.abs(diff)) + meta.unit + ' to go' };
    }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Compute average daily intake across all days with food data
  function computeAverages() {
    var keys = lsKeys();
    var prefix = STORAGE_PREFIX + 'foods:';
    var sums = {};
    for (var i = 0; i < macroMeta.length; i++) sums[macroMeta[i].key] = 0;
    var dayCount = 0;
    for (var k = 0; k < keys.length; k++) {
      if (keys[k].indexOf(prefix) === 0) {
        try {
          var arr = JSON.parse(lsGet(keys[k]) || '[]');
          if (Array.isArray(arr) && arr.length > 0) {
            dayCount++;
            for (var j = 0; j < arr.length; j++) {
              var f = arr[j];
              for (var m = 0; m < macroMeta.length; m++) {
                var mk = macroMeta[m].key;
                sums[mk] += (Number(f[mk]) || 0);
              }
            }
          }
        } catch (e) {}
      }
    }
    var avgs = {};
    for (var i2 = 0; i2 < macroMeta.length; i2++) {
      var key = macroMeta[i2].key;
      avgs[key] = dayCount > 0 ? sums[key] / dayCount : 0;
    }
    avgs._dayCount = dayCount;
    return avgs;
  }

  function renderBars() {
    var list = document.getElementById('bars-list');
    if (!list) return;
    var t = totals();
    var averages = computeAverages();
    var dayCount = averages._dayCount;
    var todayFlag = isToday(selectedDate);

    var html = '';
    for (var i = 0; i < barOrder.length; i++) {
      var key = barOrder[i];
      var m = getMacroByKey(key);
      if (!m) continue;
      var current = t[key] || 0;
      var goal = goals[key] || 0;
      var pct = goal > 0 ? Math.min(current / goal, 1) : 0;
      var widthPct = (pct * 100).toFixed(2);
      var status = getStatusClass(m, current, goal, todayFlag);

      var avg = averages[key] || 0;
      var avgText = '';
      if (dayCount >= 1) {
        avgText = 'avg ' + Math.round(avg) + m.unit + (goal > 0 ? ' · ' + Math.round((avg / goal) * 100) + '% of goal' : '') + ' (over ' + dayCount + ' day' + (dayCount === 1 ? '' : 's') + ')';
      }

      html += '<div class="bar-row" data-key="' + key + '" draggable="false">';
      html +=   '<div class="bar-meta">';
      html +=     '<span class="bar-label-wrap">';
      html +=       '<span class="bar-handle" aria-label="Drag to reorder"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="3" r="1"/><circle cx="8" cy="3" r="1"/><circle cx="2" cy="7" r="1"/><circle cx="8" cy="7" r="1"/><circle cx="2" cy="11" r="1"/><circle cx="8" cy="11" r="1"/></svg></span>';
      html +=       '<span class="bar-label">' + m.label + '</span>';
      html +=     '</span>';
      html +=     '<span class="bar-values">' + Math.round(current) + m.unit + '<span class="of">/ ' + goal + m.unit + '</span></span>';
      html +=   '</div>';
      html +=   '<div class="bar-track"><div class="bar-fill ' + status.fill + '" style="width:' + widthPct + '%"></div></div>';
      html +=   '<div class="bar-status ' + status.status + '">' + status.text + '</div>';
      if (avgText) html += '<div class="bar-avg">' + avgText + '</div>';
      html += '</div>';
    }
    list.innerHTML = html;

    setupBarDrag();
  }

  // Pointer-based drag-to-reorder for bars (works on mouse + touch).
  // Only visually translates the dragged row during the drag; commits the new
  // order to barOrder and re-renders on pointerup.
  var dragState = null;

  function setupBarDrag() {
    var list = document.getElementById('bars-list');
    if (!list) return;
    var handles = list.querySelectorAll('.bar-handle');
    for (var i = 0; i < handles.length; i++) {
      handles[i].addEventListener('pointerdown', onDragStart);
    }
  }

  function onDragStart(e) {
    e.preventDefault();
    var row = e.currentTarget.closest('.bar-row');
    if (!row) return;
    var list = document.getElementById('bars-list');
    if (!list) return;
    var rows = list.querySelectorAll('.bar-row');
    var rects = [];
    var startIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i].getBoundingClientRect();
      rects.push({ top: r.top, height: r.height, mid: r.top + r.height / 2 });
      if (rows[i] === row) startIdx = i;
    }
    if (startIdx < 0) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    dragState = {
      row: row,
      list: list,
      rows: rows,
      rects: rects,
      startIdx: startIdx,
      currentIdx: startIdx,
      startY: e.clientY,
      pointerId: e.pointerId
    };
    row.classList.add('bar-row-dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
  }

  function onDragMove(e) {
    if (!dragState) return;
    e.preventDefault();
    var dy = e.clientY - dragState.startY;
    dragState.row.style.transform = 'translateY(' + dy + 'px)';

    // Where is the visual center of the dragged row?
    var draggedMid = dragState.rects[dragState.startIdx].mid + dy;

    // Find what index this should be at by checking against original midpoints
    var newIdx = dragState.startIdx;
    for (var i = 0; i < dragState.rects.length; i++) {
      if (i === dragState.startIdx) continue;
      var mid = dragState.rects[i].mid;
      if (i < dragState.startIdx && draggedMid < mid) { newIdx = i; break; }
      if (i > dragState.startIdx && draggedMid > mid) newIdx = i;
    }

    if (newIdx !== dragState.currentIdx) {
      dragState.currentIdx = newIdx;
      // Compute the slot height = height + gap between rows
      var slotHeight;
      if (dragState.rects.length > 1) {
        slotHeight = dragState.rects[1].top - dragState.rects[0].top;
      } else {
        slotHeight = dragState.rects[0].height;
      }
      // Visually shift non-dragged rows to make room
      for (var k = 0; k < dragState.rows.length; k++) {
        if (k === dragState.startIdx) continue;
        var shift = 0;
        if (dragState.startIdx < newIdx && k > dragState.startIdx && k <= newIdx) {
          shift = -slotHeight;
        } else if (dragState.startIdx > newIdx && k < dragState.startIdx && k >= newIdx) {
          shift = slotHeight;
        }
        dragState.rows[k].style.transform = 'translateY(' + shift + 'px)';
      }
    }
  }

  function onDragEnd(e) {
    if (!dragState) return;
    // Clear all transforms
    for (var i = 0; i < dragState.rows.length; i++) {
      dragState.rows[i].style.transform = '';
    }
    dragState.row.classList.remove('bar-row-dragging');

    // Commit reorder if changed
    if (dragState.currentIdx !== dragState.startIdx) {
      var key = barOrder[dragState.startIdx];
      barOrder.splice(dragState.startIdx, 1);
      barOrder.splice(dragState.currentIdx, 0, key);
      saveBarOrder();
      renderBars();
    }

    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);
    dragState = null;
  }

  function getDatesWithData() {
    var dates = {};
    var keys = lsKeys();
    var prefix = STORAGE_PREFIX + 'foods:';
    var gymPrefix = STORAGE_PREFIX + 'gym:';
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].indexOf(prefix) === 0) {
        var dk = keys[i].substring(prefix.length);
        try {
          var raw = lsGet(keys[i]);
          var arr = raw ? JSON.parse(raw) : [];
          if (arr && arr.length > 0) dates[dk] = dates[dk] || {};
          if (arr && arr.length > 0) dates[dk].food = true;
        } catch (e) {}
      }
      if (keys[i].indexOf(gymPrefix) === 0) {
        var gdk = keys[i].substring(gymPrefix.length);
        if (lsGet(keys[i]) === '1') {
          dates[gdk] = dates[gdk] || {};
          dates[gdk].gym = true;
        }
      }
    }
    return dates;
  }

  function quickAdd(name, qty) {

    function r1(n) { return Math.round(n * 10) / 10; }
    var displayName = q === 1 ? template.name : (template.name + ' ×' + (q % 1 === 0 ? q : r1(q)));
    var entry = {
      id: Date.now(), name: displayName,
      calories: r1((template.calories || 0) * q),
      protein: r1((template.protein || 0) * q),
      carbs: r1((template.carbs || 0) * q),
      fat: r1((template.fat || 0) * q),
      fiber: r1((template.fiber || 0) * q),
      sugar: r1((template.sugar || 0) * q),
      cholesterol: r1((template.cholesterol || 0) * q),
      sodium: r1((template.sodium || 0) * q)
    };
    foods.unshift(entry);
    saveFoodsForDate(selectedDate, foods);
    renderBars();
    renderEntries();

  function renderLibrary() {

    var body = document.getElementById('library-body');
    if (!section || !grid) return;

      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    count.textContent = '— ' + library.length;

    // Apply search filter
    var searchEl = document.getElementById('library-search');
    var query = searchEl ? (searchEl.value || '').toLowerCase().replace(/^\s+|\s+$/g, '') : '';

    // Sort alphabetically (case-insensitive)
    var sortedLibrary = library.slice().sort(function(a, b) {
      var an = (a.name || '').toLowerCase();
      var bn = (b.name || '').toLowerCase();
      if (an < bn) return -1;
      if (an > bn) return 1;
      return 0;
    });

    // Filter by query
    if (query) {
      sortedLibrary = sortedLibrary.filter(function(item) {
        return (item.name || '').toLowerCase().indexOf(query) !== -1;
      });
    }

    var emptyEl = document.getElementById('library-empty');
    if (emptyEl) emptyEl.style.display = (sortedLibrary.length === 0 && query) ? 'block' : 'none';

    function fmtQty(n) { return n % 1 === 0 ? String(n) : String(Math.round(n * 10) / 10); }

    var html = '';
    for (var i = 0; i < sortedLibrary.length; i++) {
      var item = sortedLibrary[i];
      var lcKey = item.name.toLowerCase();
      var qty = libQty[lcKey];
      if (!qty || qty <= 0) qty = 1;
      html += '<div class="saved-food" data-key="' + escapeHtml(lcKey) + '">';
      html +=   '<div class="pill-qty">';
      html +=     '<button type="button" class="qty-btn qty-dec" data-name="' + escapeHtml(item.name) + '" aria-label="Decrease quantity">−</button>';

      html +=   '</div>';
      html +=   '<button type="button" class="pill-add" data-name="' + escapeHtml(item.name) + '">+ ' + escapeHtml(item.name) + '<span class="pill-cal">' + Math.round(item.calories || 0) + ' cal</span></button>';
      html +=   '<button type="button" class="pill-edit" data-name="' + escapeHtml(item.name) + '" aria-label="Edit macros"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
      html +=   '<button type="button" class="pill-remove" data-name="' + escapeHtml(item.name) + '" aria-label="Remove from library"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
      html += '</div>';
    }
    grid.innerHTML = html;

    // Apply open/closed state
    if (body) {
      if (libraryOpen) { body.classList.add('open'); } else { body.classList.remove('open'); }
    }
    if (chevron) {
      if (libraryOpen) { chevron.classList.add('open'); } else { chevron.classList.remove('open'); }
    }

    function updateQtyDisplay(name) {
      var lcKey = name.toLowerCase();
      var val = libQty[lcKey] || 1;
      var span = grid.querySelector('.qty-val[data-name="' + name.replace(/"/g, '\\"') + '"]');
      if (span) span.textContent = fmtQty(val);
    }

    var decBtns = grid.querySelectorAll('.qty-dec');
    for (var d = 0; d < decBtns.length; d++) decBtns[d].onclick = function() {
      var n = this.getAttribute('data-name');
      var lcKey = n.toLowerCase();
      var cur = libQty[lcKey] || 1;
      // Decrement: step by 1 if >= 2, otherwise by 0.5 down to 0.5
      var next;
      if (cur > 1) next = cur - 1;
      else if (cur > 0.5) next = 0.5;
      else next = 0.5;
      libQty[lcKey] = next;
      updateQtyDisplay(n);
    };
    var incBtns = grid.querySelectorAll('.qty-inc');
    for (var ic = 0; ic < incBtns.length; ic++) incBtns[ic].onclick = function() {
      var n = this.getAttribute('data-name');
      var lcKey = n.toLowerCase();
      var cur = libQty[lcKey] || 1;
      // Increment: 0.5 -> 1, otherwise step by 1
      var next = cur < 1 ? 1 : cur + 1;
      libQty[lcKey] = next;
      updateQtyDisplay(n);
    };
    var addBtns = grid.querySelectorAll('.pill-add');
    for (var a = 0; a < addBtns.length; a++) addBtns[a].onclick = function() {
      var n = this.getAttribute('data-name');
      var lcKey = n.toLowerCase();
      var q = libQty[lcKey] || 1;
      quickAdd(n, q);
      // Reset qty to 1 after adding
      libQty[lcKey] = 1;
      updateQtyDisplay(n);
    };
    var editBtns = grid.querySelectorAll('.pill-edit');
    for (var e = 0; e < editBtns.length; e++) editBtns[e].onclick = function() { openEditFood(this.getAttribute('data-name')); };
    var removeBtns = grid.querySelectorAll('.pill-remove');
    for (var r = 0; r < removeBtns.length; r++) removeBtns[r].onclick = function() { removeFromLibrary(this.getAttribute('data-name')); renderLibrary(); };
  }

  function toggleLibrary() {
    libraryOpen = !libraryOpen;
    lsSet(STORAGE_PREFIX + 'libraryOpen', libraryOpen ? '1' : '0');
    var body = document.getElementById('library-body');
    var chevron = document.getElementById('library-chevron');
    if (body) { if (libraryOpen) body.classList.add('open'); else body.classList.remove('open'); }
    if (chevron) { if (libraryOpen) chevron.classList.add('open'); else chevron.classList.remove('open'); }
  }

  // Gym tracking
  function gymKey(dateKey) { return STORAGE_PREFIX + 'gym:' + dateKey; }

  function loadGymForDate(d) {
    return lsGet(gymKey(dateToKey(d))) === '1';
  }

  function saveGymForDate(d, val) {
    if (val) { lsSet(gymKey(dateToKey(d)), '1'); }
    else { lsRemove(gymKey(dateToKey(d))); }
  }

  function renderGym() {
    var cb = document.getElementById('gym-checkbox');
    var badge = document.getElementById('gym-badge');
    var section = document.getElementById('gym-section');
    if (!cb || !badge || !section) return;
    var went = loadGymForDate(selectedDate);
    cb.checked = went;
    if (went) badge.classList.add('visible'); else badge.classList.remove('visible');
    // Show gym toggle on all days (past and present) so you can view history
    section.style.display = 'flex';
    // Disable checkbox on past days if you want read-only — keep editable for all days
    cb.disabled = false;
  }

  function saveGoals() { lsSet(STORAGE_PREFIX + 'goals', JSON.stringify(goals)); }
  function saveTheme() { lsSet(STORAGE_PREFIX + 'theme', dark ? 'dark' : 'light'); }

  var formQty = 1;

  function setFormQty(n) {
    if (!n || n < 1) n = 1;
    formQty = n;
    var valEl = document.getElementById('form-qty-val');
    var stepperEl = document.getElementById('form-qty-stepper');
    var toggleEl = document.getElementById('form-qty-toggle');
    if (valEl) valEl.textContent = formQty % 1 === 0 ? String(formQty) : String(Math.round(formQty * 10) / 10);
    if (formQty > 1) {
      if (stepperEl) stepperEl.style.display = 'inline-flex';
      if (toggleEl) toggleEl.style.display = 'none';
    } else {
      if (stepperEl) stepperEl.style.display = 'none';
      if (toggleEl) toggleEl.style.display = 'inline-block';
    }
  }

  function addFood() {
    if (!isToday(selectedDate)) return;
    var nameEl = document.getElementById('name');
    var name = nameEl.value.replace(/^\s+|\s+$/g, '');
    if (!name) return;
    var q = formQty > 0 ? formQty : 1;
    function r1(n) { return Math.round(n * 10) / 10; }

    // Per-unit macros (for the library template)
    var perUnit = { name: name };
    for (var i = 0; i < macroMeta.length; i++) {
      var key = macroMeta[i].key;
      perUnit[key] = parseFloat(document.getElementById('m-' + key).value) || 0;
    }

    // Logged entry: scaled by qty; name gets "× q" suffix when q > 1
    var displayName = q === 1 ? name : (name + ' ×' + (q % 1 === 0 ? q : r1(q)));
    var entry = { id: Date.now(), name: displayName };
    for (var k = 0; k < macroMeta.length; k++) {
      var mk = macroMeta[k].key;
      entry[mk] = r1((perUnit[mk] || 0) * q);
    }

    foods.unshift(entry);
    saveFoodsForDate(selectedDate, foods);
    // Save the per-unit version to the library so future quick-adds scale properly
    addToLibrary(perUnit);

    nameEl.value = '';
    for (var j = 0; j < macroMeta.length; j++) document.getElementById('m-' + macroMeta[j].key).value = '';
    document.getElementById('record-btn').disabled = true;
    setFormQty(1);
    renderBars();
    renderEntries();
    renderLibrary();
  }

  function removeFood(id) {
    var newFoods = [];
    for (var i = 0; i < foods.length; i++) {
      if (foods[i].id !== id) newFoods.push(foods[i]);
    }
    foods = newFoods;
    saveFoodsForDate(selectedDate, foods);
    renderBars();
    renderEntries();
  }

  function openSettings() {
    var root = document.getElementById('modal-root');
    var html = '<div class="modal-overlay" id="modal-overlay">';
    html +=   '<div class="modal">';
    html +=     '<div class="modal-header">';
    html +=       '<div><div class="eyebrow">Configure</div><h2 class="modal-title">Daily Targets</h2></div>';
    html +=       '<button class="icon-btn" id="modal-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    html +=     '</div>';
    html +=     '<div id="modal-body">';
    for (var i = 0; i < macroMeta.length; i++) {
      var m = macroMeta[i];
      var fullLabel = m.key === 'carbs' ? 'Carbohydrates' : m.label;
      html += '<div class="modal-row"><label>' + fullLabel + '</label><div style="display:flex;align-items:baseline;"><input class="goal-input" type="number" inputmode="decimal" data-key="' + m.key + '" value="' + (goals[m.key] || 0) + '" /><span class="unit">' + m.unit + '</span></div></div>';
    }
    html +=     '</div>';
    html +=     '<div class="cal-check" id="cal-check"></div>';
    html +=     '<button class="modal-save" id="modal-save" type="button">Save &amp; Close</button>';
    html +=   '</div>';
    html += '</div>';
    root.innerHTML = html;

    function updateCalCheck() {
      var inputs = document.querySelectorAll('.goal-input');
      var tmp = {};
      for (var i = 0; i < inputs.length; i++) {
        tmp[inputs[i].getAttribute('data-key')] = parseFloat(inputs[i].value) || 0;
      }
      var calc = (tmp.protein || 0) * 4 + (tmp.carbs || 0) * 4 + (tmp.fat || 0) * 9;
      var set = tmp.calories || 0;
      var diff = calc - set;
      var box = document.getElementById('cal-check');
      if (!box) return;
      var msg = 'From macros: <strong>' + Math.round(calc) + ' cal</strong> (P×4 + C×4 + F×9)';
      var pct = set > 0 ? Math.abs(diff) / set : 0;
      var cls = 'cal-check';
      if (set > 0) {
        if (pct < 0.05) {
          msg += ' · matches your calorie goal';
        } else {
          cls += pct > 0.15 ? ' cal-check-bad' : ' cal-check-warn';
          msg += ' · ' + (diff > 0 ? '+' : '−') + Math.abs(Math.round(diff)) + ' off goal';
        }
      }
      box.className = cls;
      box.innerHTML = msg;
    }

    function close() {
      var inputs = document.querySelectorAll('.goal-input');
      for (var i = 0; i < inputs.length; i++) {
        var v = parseFloat(inputs[i].value) || 0;
        goals[inputs[i].getAttribute('data-key')] = v;
      }
      saveGoals();
      renderBars();
      root.innerHTML = '';
    }
    document.getElementById('modal-overlay').onclick = function(e) { if (e.target.id === 'modal-overlay') close(); };
    document.getElementById('modal-close').onclick = close;
    document.getElementById('modal-save').onclick = close;
    // Live-update cal check on any input
    var inputs = document.querySelectorAll('.goal-input');
    for (var i = 0; i < inputs.length; i++) inputs[i].addEventListener('input', updateCalCheck);
    updateCalCheck();
  }

  // Wire up
  applyTheme();
  setSelectedDate(todayDate());
  renderLibrary();
  renderGym();

  document.getElementById('theme-btn').onclick = function() {
    dark = !dark;
    saveTheme();
    applyTheme();
    renderBars();
  };
  document.getElementById('settings-btn').onclick = openSettings;
  document.getElementById('record-btn').onclick = addFood;
  document.getElementById('date-prev').onclick = function() { changeDay(-1); };
  document.getElementById('date-next').onclick = function() { changeDay(1); };
  document.getElementById('date-display').onclick = toggleCalendar;

  // Form quantity controls
  var formQtyToggle = document.getElementById('form-qty-toggle');
  var formQtyInc = document.getElementById('form-qty-inc');
  var formQtyDec = document.getElementById('form-qty-dec');
  if (formQtyToggle) formQtyToggle.onclick = function() { setFormQty(2); };
  if (formQtyInc) formQtyInc.onclick = function() {
    setFormQty(formQty + 1);
  };
  if (formQtyDec) formQtyDec.onclick = function() {
    setFormQty(formQty - 1); // setFormQty floors at 1
  };
  setFormQty(1);

  var libraryHeader = document.getElementById('library-header');
  if (libraryHeader) libraryHeader.onclick = toggleLibrary;

  var librarySearchEl = document.getElementById('library-search');
  if (librarySearchEl) {
    librarySearchEl.addEventListener('input', renderLibrary);
    // Prevent toggleLibrary from firing when clicking inside the search input area
    librarySearchEl.addEventListener('click', function(e) { e.stopPropagation(); });
  }

  var gymCb = document.getElementById('gym-checkbox');
  if (gymCb) {
    gymCb.onchange = function() {
      saveGymForDate(selectedDate, this.checked);
      var badge = document.getElementById('gym-badge');
      if (badge) { if (this.checked) badge.classList.add('visible'); else badge.classList.remove('visible'); }
    };
  }

  var nameInput = document.getElementById('name');
  nameInput.addEventListener('input', function() {
    document.getElementById('record-btn').disabled = !nameInput.value.replace(/^\s+|\s+$/g, '');
  });
  function onEnter(e) { if (e.key === 'Enter' || e.keyCode === 13) addFood(); }
  nameInput.addEventListener('keydown', onEnter);
  for (var mi = 0; mi < macroMeta.length; mi++) {
    document.getElementById('m-' + macroMeta[mi].key).addEventListener('keydown', onEnter);
  }

} catch (initErr) {
  var b = document.getElementById('error-banner');
  if (b) { b.style.display = 'block'; b.textContent = 'Init error: ' + initErr.message; }
}
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', nourishInit);
} else {
  nourishInit();
}
</script>
</body>
</html>
